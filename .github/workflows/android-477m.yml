# Builds Dolphin 477M (org.dolphinemu.dolphinemu.rg477m): the Android app with the RG477M
# defaults (-DDOLPHIN_477M=ON, Source/Android/app/build.gradle.kts), arm64 only, debug-signed so
# it installs as is. Native code is RelWithDebInfo in this build type, as upstream.
name: Android APK (477M)

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'Languages/**']
  workflow_dispatch:

concurrency:
  group: android-477m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Dolphin's version comes from `git describe`; without the release tags it is a bare
      # hash, which RetroAchievements doesn't recognise as a supported Dolphin
      - name: Release tags
        run: git fetch --no-recurse-submodules --tags https://github.com/dolphin-emu/dolphin.git || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK pieces
        run: |
          NDK=$(grep -oP 'ndkVersion = "\K[^"]+' Source/Android/app/build.gradle.kts)
          SDK=$(grep -oP 'compileSdk = \K[0-9]+' Source/Android/app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SM" "ndk;$NDK" >/dev/null
          # newer platforms are published as android-NN.0; Gradle fetches it itself otherwise
          "$SM" "platforms;android-$SDK" >/dev/null 2>&1 || "$SM" "platforms;android-$SDK.0" >/dev/null 2>&1 || echo "platform $SDK left to Gradle"
          sudo apt-get install -y -qq ninja-build >/dev/null

      - name: arm64 only, no unit tests
        working-directory: Source/Android/app
        run: |
          sed -i 's|abiFilters += listOf("arm64-v8a", "x86_64")|abiFilters += listOf("arm64-v8a")|' build.gradle.kts
          sed -i 's|^\(\s*\)//targets(|\1targets(|' build.gradle.kts
          grep -n 'abiFilters\|targets(' build.gradle.kts

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            Source/Android/app/.cxx
          key: dolphin-477m-${{ hashFiles('Source/Android/**/*.kts', 'Source/Android/gradle/libs.versions.toml') }}-${{ github.sha }}
          restore-keys: dolphin-477m-${{ hashFiles('Source/Android/**/*.kts', 'Source/Android/gradle/libs.versions.toml') }}-

      - name: APK
        working-directory: Source/Android
        run: |
          # CMake copies Data/Sys into the assets only when it configures, which the
          # cached .cxx skips: copy it here so every APK carries Sys (GameCube fonts etc.)
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/Sys
          cp -r ../../Data/Sys app/src/main/assets/
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          unzip -l app/build/outputs/apk/debug/*.apk | grep -E "assets/Sys/GC/font_(western|japanese).bin"

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-477m-arm64
          path: Source/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
